name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storefront:
    name: Storefront — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_Dashboard/mi-trends

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # This project's committed lockfile is bun.lock, so there is no
      # package-lock.json for `npm ci` to use. --no-package-lock keeps the
      # runner from writing a competing one. Switching this job to bun (or
      # committing a package-lock.json) is still an open decision.
      - name: Install
        run: npm install --no-package-lock

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # No Supabase or other credentials are referenced anywhere in this
      # app — the catalogue is generated in lib/catalog.ts — so the build
      # needs no environment at all.
      - name: Build
        run: npm run build

  admin:
    name: Admin panel — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend_Dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend_Dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this typechecks too.
      - name: Build
        run: npm run build

  api:
    name: API — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        run: npm ci

      # The generated client has to exist before anything referencing
      # @prisma/client will typecheck.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck
